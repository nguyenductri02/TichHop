<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="bg-blue-800 text-white w-64 py-4 flex flex-col">
      <div class="px-4 py-4 border-b border-blue-700">
        <h1 class="text-2xl font-bold">Admin</h1>
      </div>
      <nav class="flex-1 px-2 py-4 space-y-2">
        <a href="#" class="flex items-center px-4 py-3 bg-blue-700 rounded-lg">
          <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
        </a>
        <a href="users.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-user-shield mr-3"></i> Accounts & Roles
        </a>
        <a href="employees.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-users mr-3"></i> Employees
        </a>
        <a href="payroll.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-money-bill-wave mr-3"></i> Payroll
        </a>
        <a href="departments.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-building mr-3"></i> Departments
        </a>
        <a href="job_titles.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-briefcase mr-3"></i> Job Titles
        </a>
        <a href="reports.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-chart-bar mr-3"></i> Reports
        </a>
        <a href="notifications.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-bell mr-3"></i> Alerts
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 text-gray-300 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-cogs mr-3"></i> System Settings
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-blue-700">
        <a href="login.html" class="flex items-center text-gray-300 hover:text-white">
          <i class="fas fa-sign-out-alt mr-3"></i> Logout
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between px-6 py-4">
          <h2 class="text-xl font-semibold text-gray-800">Admin Dashboard</h2>
          <div class="flex items-center space-x-4">
            <button class="relative">
              <i class="fas fa-bell text-gray-600 text-xl"></i>
              <span class="absolute top-0 right-0 -mt-1 -mr-1 px-2 py-0.5 bg-red-500 text-white text-xs rounded-full">3</span>
            </button>
            <div class="flex items-center">
              <img class="h-8 w-8 rounded-full" src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg" alt="Admin" />
              <span class="ml-2 text-gray-700">Admin</span>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
          <!-- Employees -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
              <i class="fas fa-users text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Employees</p>
              <h3 class="text-xl font-semibold text-gray-700">1,254</h3>
            </div>
          </div>
      
          <!-- Departments -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-green-100 text-green-600">
              <i class="fas fa-building text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Departments</p>
              <h3 class="text-xl font-semibold text-gray-700">12</h3>
            </div>
          </div>
      
          <!-- Job Titles -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
              <i class="fas fa-briefcase text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Job Titles</p>
              <h3 class="text-xl font-semibold text-gray-700">45</h3>
            </div>
          </div>
      
          <!-- Payroll -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-red-100 text-red-600">
              <i class="fas fa-file-invoice-dollar text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Payroll</p>
              <h3 class="text-xl font-semibold text-gray-700">Monthly</h3>
            </div>
          </div>
      
          <!-- Reports -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-purple-100 text-purple-600">
              <i class="fas fa-chart-bar text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Reports</p>
              <h3 class="text-xl font-semibold text-gray-700">8 New</h3>
            </div>
          </div>
      
          <!-- Alerts -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-pink-100 text-pink-600">
              <i class="fas fa-bell text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Alerts</p>
              <h3 class="text-xl font-semibold text-gray-700">3 Urgent</h3>
            </div>
          </div>
      
          <!-- Accounts & Roles -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-indigo-100 text-indigo-600">
              <i class="fas fa-user-shield text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">Accounts & Roles</p>
              <h3 class="text-xl font-semibold text-gray-700">25 Users</h3>
            </div>
          </div>
      
          <!-- System Settings -->
          <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
            <div class="p-3 rounded-full bg-gray-200 text-gray-600">
              <i class="fas fa-cogs text-xl"></i>
            </div>
            <div class="ml-4">
              <p class="text-sm text-gray-500">System Settings</p>
              <h3 class="text-xl font-semibold text-gray-700">Updated</h3>
            </div>
          </div>
        </div>
      </main>
