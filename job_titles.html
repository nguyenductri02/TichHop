      </div>

        <a href="index.html" class="flex items-center px-4 py-3 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
        </a>
        <a href="users.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-user-shield mr-3"></i> Accounts & Roles
        </a>
        <a href="employees.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-users mr-3"></i> Employees
        </a>
        <a href="payroll.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-money-bill-wave mr-3"></i> Payroll

        <a href="departments.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">

        </a>
        <a href="job_titles.html" class="flex items-center px-4 py-3 bg-blue-700 rounded-lg">
          <i class="fas fa-briefcase mr-3"></i> Job Titles
        </a>
        <a href="reports.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-chart-bar mr-3"></i> Reports
        </a>
        <a href="notifications.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-bell mr-3"></i> Alerts
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-cogs mr-3"></i> System Settings
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-blue-700">
        <a href="login.html" class="flex items-center text-gray-300 hover:text-white">
          <i class="fas fa-sign-out-alt mr-3"></i> Logout
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Top Header -->
      <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center">
                <h2 class="text-xl font-semibold text-gray-800">Job Title Management</h2>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative">
                    <i class="fas fa-bell text-gray-600 text-xl"></i>
                    <span class="absolute top-0 right-0 -mt-1 -mr-1 px-2 py-0.5 bg-red-500 text-white text-xs rounded-full">3</span>
                </button>
                <div class="flex items-center">
                    <img class="h-8 w-8 rounded-full" src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Profile">
                    <span class="ml-2 text-gray-700">HR Manager</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
        <!-- Job Title Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-sm p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-briefcase text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Total Job Titles</p>
                        <h3 class="text-xl font-semibold text-gray-700">45</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Job Title List -->
        <div class="bg-white rounded-lg shadow-sm">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-800">Job Titles</h3>
                <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    <i class="fas fa-plus mr-2"></i>Add Job Title
                </button>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="jobTitlesContainer">
                    <!-- Job Titles will be dynamically rendered here -->

            </div>

</div>
</div>

<!-- Add Job Title Modal -->
<div id="addJobTitleModal" class="hidden fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
<div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
        <form id="addJobTitleForm">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Add New Job Title</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Job Title</label>
                        <input type="text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
                        <select required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="">Select department</option>
                            <option value="it">IT</option>
                            <option value="hr">HR</option>
                            <option value="marketing">Marketing</option>
                            <option value="finance">Finance</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                    Add Job Title
                </button>
                <button type="button" onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
</div>

<script>
const API_BASE_URL = 'http://localhost:5115/api'; // Adjust if your backend runs elsewhere

function getAuthToken() {
    return localStorage.getItem('authToken');
}

async function fetchJobTitles() {
    const token = getAuthToken();
    if (!token) { window.location.href = 'login.html'; return; }

    try {
        const response = await fetch(`${API_BASE_URL}/Integration/positions`, {
             headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.status === 401) { window.location.href = 'login.html'; return; }
        if (!response.ok) throw new Error('Failed to fetch job titles');
        
        const jobTitles = await response.json();
        
        const jobTitlesWithPlaceholders = jobTitles.map(jt => ({
            id: jt.positionId,
            name: jt.name,
            department: jt.departmentName || 'N/A',
            employeeCount: 'N/A',
            icon: "fa-briefcase",
            color: "gray"
        }));

        renderJobTitles(jobTitlesWithPlaceholders);
        updateJobTitleStats(jobTitles.length);

    } catch (error) {
        console.error("Error fetching job titles:", error);
        const container = document.getElementById('jobTitlesContainer');
        if (container) container.innerHTML = `<p class="text-center col-span-full text-red-500">Failed to load job titles: ${error.message}</p>`;
        updateJobTitleStats(0);
    }
}

function renderJobTitles(jobTitles) {
    const container = document.getElementById('jobTitlesContainer'); 
    container.innerHTML = '';

    if (!jobTitles || jobTitles.length === 0) {
        container.innerHTML = '<p class="text-center col-span-full">No job titles found.</p>';
        return;
    }

    jobTitles.forEach(jt => {
        const card = `
            <div class="bg-white border rounded-lg overflow-hidden hover:shadow-lg transition-shadow">
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                                <i class="fas fa-briefcase text-xl"></i>
                            </div>
                            <h4 class="text-lg font-semibold text-gray-800 ml-3">${jt.name}</h4>
                        </div>
                        <div class="flex space-x-2">
                            <button class="text-blue-600 hover:text-blue-800" onclick="editJobTitle(${jt.id}, '${jt.name}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-red-600 hover:text-red-800" onclick="deleteJobTitle(${jt.id}, '${jt.name}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Employees:</span>
                            <span class="font-medium">${jt.employeeCount || 'N/A'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Department:</span>
                            <span class="font-medium">${jt.department || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
    });
}

function updateJobTitleStats(count) {
    const totalStat = document.querySelector('.fa-briefcase.text-xl').closest('.flex.items-center').querySelector('h3');
    if (totalStat) totalStat.textContent = count;
}

function openAddJobTitleModal() {
    document.getElementById('addJobTitleModal').classList.remove('hidden');
}

function closeAddJobTitleModal() {
    document.getElementById('addJobTitleModal').classList.add('hidden');
    document.getElementById('addJobTitleForm').reset();
}

async function handleAddJobTitle(event) {
    event.preventDefault();
    const token = getAuthToken(); 
    if (!token) { window.location.href = 'login.html'; return; }

    const titleNameInput = event.target.querySelector('input[type="text"]');
    const departmentSelect = event.target.querySelector('select');
    
    const titleName = titleNameInput.value;

    if (!titleName) {
        alert("Job Title name is required.");
        return;
    }

    const payload = { 
        name: titleName
    };

    try {
        const response = await fetch(`${API_BASE_URL}/Integration/positions`, { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify(payload) 
        });
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || `Failed to add job title. Status: ${response.status}`);
        }
        alert('Job title added successfully!');
        closeAddJobTitleModal();
        fetchJobTitles();
    } catch (error) {
        console.error("Error adding job title:", error);
        alert(`Failed to add job title: ${error.message}`);
    }
}

function editJobTitle(id, name) { 
    const newName = prompt(`Enter new name for job title "${name}" (ID: ${id}):`, name);
    if (newName && newName !== name) {
        const token = getAuthToken();
        if (!token) { window.location.href = 'login.html'; return; }
        
        fetch(`${API_BASE_URL}/Integration/positions/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ positionId: id, name: newName })
        })
        .then(response => {
            if (!response.ok) throw new Error('Failed to update job title.');
            alert(`Job title ${id} updated successfully.`);
            fetchJobTitles();
        })
        .catch(error => {
            console.error("Error updating job title:", error);
            alert(`Failed to update job title: ${error.message}`);
        });
    }
}

async function deleteJobTitle(id, name) { 
    if (!confirm(`Are you sure you want to delete job title "${name}" (ID: ${id})?`)) return;

    const token = getAuthToken();
    if (!token) { window.location.href = 'login.html'; return; }

    try {
        const response = await fetch(`${API_BASE_URL}/Integration/positions/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || `Failed to delete job title. Status: ${response.status}`);
        }
        alert(`Job title "${name}" (ID: ${id}) deleted successfully.`);
        fetchJobTitles();
    } catch (error) {
        console.error("Error deleting job title:", error);
        alert(`Failed to delete job title: ${error.message}`);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const jobTitlesGrid = document.querySelector('.grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-3.gap-6');
    if (jobTitlesGrid) jobTitlesGrid.id = 'jobTitlesContainer';

    const addJobTitleButton = document.querySelector('button .fa-plus');
    if (addJobTitleButton) {
        addJobTitleButton.parentElement.addEventListener('click', openAddJobTitleModal);
    }
    
    const addJobTitleForm = document.getElementById('addJobTitleForm');
    if (addJobTitleForm) {
        addJobTitleForm.addEventListener('submit', handleAddJobTitle);
    }

    fetchJobTitles();
});
</script>
</body>
</html>
