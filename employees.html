<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="hidden fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
<div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
<div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
<span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
<div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
    <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
            <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
                <i class="fas fa-exclamation-triangle text-red-600"></i>
            </div>
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Delete Employee</h3>
                <div class="mt-2">
                    <p class="text-sm text-gray-500">Are you sure you want to delete this employee? This action cannot be undone.</p>
                </div>
            </div>
        </div>
    </div>
    <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
        <button type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm" onclick="deleteEmployee()">Delete</button>
        <button type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm" onclick="closeDeleteModal()">Cancel</button>
    </div>

<script>
const API_BASE_URL = 'http://localhost:5115/api'; // Adjust if your backend runs elsewhere
let currentPage = 1;
const pageSize = 10;
let allEmployees = [];
let totalEmployees = 0;

function getAuthToken() {
    return localStorage.getItem('authToken');
}

async function fetchEmployees(page = 1, size = 10, sortBy = 'EmployeeId', sortDesc = false) {
    const token = getAuthToken();
    if (!token) {
        window.location.href = 'login.html';
        return;
    }
    try {
        const response = await fetch(`${API_BASE_URL}/Integration/employees?page=${page}&pageSize=${size}&sortBy=${sortBy}&sortDesc=${sortDesc}`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (response.status === 401) {
            window.location.href = 'login.html'; // Redirect if unauthorized
            return;
        }
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        allEmployees = data.employees;
        totalEmployees = data.total;
        renderEmployeesTable(allEmployees);
        renderPagination(totalEmployees, page, size);
    } catch (error) {
        console.error('Failed to fetch employees:', error);
        document.getElementById('employeeTableBody').innerHTML = '<tr><td colspan="5" class="text-center py-4">Failed to load employees.</td></tr>';
    }
}

function renderEmployeesTable(employees) {
    const tableBody = document.getElementById('employeeTableBody');
    if (!tableBody) {
        console.error('Table body not found');
        return;
    }
    tableBody.innerHTML = ''; // Clear existing rows

    if (!employees || employees.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4">No employees found.</td></tr>';
        return;
    }

    employees.forEach(employee => {
        const row = `
            <tr>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 h-10 w-10">
                            <img class="h-10 w-10 rounded-full" src="https://images.pexels.com/photos/2379004/pexels-photo-2379004.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="${employee.fullName}">
                        </div>
                        <div class="ml-4">
                            <div class="text-sm font-medium text-gray-900">${employee.fullName}</div>
                            <div class="text-sm text-gray-500">EMP${String(employee.employeeId || 'N/A').padStart(3, '0')}</div>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm text-gray-900">${employee.departmentName || 'N/A'}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm text-gray-900">${employee.positionName || 'N/A'}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${employee.status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                        ${employee.status}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                    <button class="text-blue-600 hover:text-blue-900 mr-3" onclick="window.location.href='edit_employee.html?id=${employee.employeeId}'">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="text-red-600 hover:text-red-900" onclick="confirmDeleteEmployee(${employee.employeeId}, '${employee.fullName}')">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </td>
            </tr>
        `;
        tableBody.insertAdjacentHTML('beforeend', row);
    });
}

function renderPagination(totalItems, currentPage, pageSize) {
    const paginationContainer = document.getElementById('paginationContainer');
    if (!paginationContainer) return;

    const totalPages = Math.ceil(totalItems / pageSize);
    paginationContainer.innerHTML = ''; // Clear existing pagination

    if (totalPages <= 1) return;

    let paginationHTML = `
        <div>
            <p class="text-sm text-gray-700">
                Showing <span class="font-medium">${(currentPage - 1) * pageSize + 1}</span>
                to <span class="font-medium">${Math.min(currentPage * pageSize, totalItems)}</span>
                of <span class="font-medium">${totalItems}</span> results
            </p>
        </div>
        <div>
            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
    `;

    // Previous button
    paginationHTML += `
        <a href="#" onclick="changePage(${currentPage - 1})" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === 1 ? 'cursor-not-allowed opacity-50' : ''}">
            <span class="sr-only">Previous</span>
            <i class="fas fa-chevron-left"></i>
        </a>`;

    // Page numbers
    for (let i = 1; i <= totalPages; i++) {
        paginationHTML += `
        <a href="#" onclick="changePage(${i})" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium ${i === currentPage ? 'text-blue-600 bg-blue-50' : 'text-gray-700 hover:bg-gray-50'}">
            ${i}
        </a>`;
    }

    // Next button
    paginationHTML += `
        <a href="#" onclick="changePage(${currentPage + 1})" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${currentPage === totalPages ? 'cursor-not-allowed opacity-50' : ''}">
            <span class="sr-only">Next</span>
            <i class="fas fa-chevron-right"></i>
        </a>`;

    paginationHTML += `</nav></div>`;
    paginationContainer.innerHTML = paginationHTML;
}

function changePage(page) {
    if (page < 1 || page > Math.ceil(totalEmployees / pageSize)) return;
    currentPage = page;
    fetchEmployees(currentPage, pageSize);
}


let employeeIdToDelete = null;
function confirmDeleteEmployee(employeeId, employeeName) {
    employeeIdToDelete = employeeId;
    document.getElementById('deleteModal').classList.remove('hidden');
    // Optional: Personalize the modal:
    // document.getElementById('modal-title').textContent = `Delete ${employeeName}`;
    // document.querySelector('#deleteModal p.text-gray-500').textContent = `Are you sure you want to delete ${employeeName}? This action cannot be undone.`;
}

function closeDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
    employeeIdToDelete = null;
}

async function deleteEmployee() {
    if (!employeeIdToDelete) return;
    const token = getAuthToken();
    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/Integration/delete-employee/${employeeIdToDelete}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });
        if (response.ok) {
            alert('Employee deleted successfully');
            fetchEmployees(currentPage, pageSize); // Refresh the list
        } else {
            const errorData = await response.json();
            alert(`Failed to delete employee: ${errorData.message || response.statusText}`);
        }
    } catch (error) {
        console.error('Error deleting employee:', error);
        alert('An error occurred while deleting the employee.');
    } finally {
        closeDeleteModal();
    }
}

// Search/Filter functionality (Client-side for now)
function applyFilters() {
    const employeeIdFilter = document.querySelector('input[placeholder="Search by ID..."]').value.toLowerCase();
    const nameFilter = document.querySelector('input[placeholder="Search by name..."]').value.toLowerCase();
    const departmentFilter = document.querySelector('select[aria-label="Department filter"]').value;
    const jobTitleFilter = document.querySelector('select[aria-label="Job Title filter"]').value;

    // For client-side filtering, you would filter `allEmployees` array.
    // However, a proper implementation would re-fetch from the server with query parameters.
    // The current backend GetEmployees supports sortBy, but not direct filtering by these fields.
    // So, this will be a placeholder for now or a simple client-side filter if all data is fetched.
    // For now, let's just re-fetch the first page as an example of triggering a search.
    fetchEmployees(1, pageSize);
    alert('Search functionality would ideally query the backend. Re-fetching first page for now.');
}


document.addEventListener('DOMContentLoaded', () => {
    fetchEmployees(currentPage, pageSize);
    
    const searchButton = document.querySelector('button .fa-search');
    if (searchButton) {
        searchButton.parentElement.addEventListener('click', applyFilters);
    }
    // Add labels to select for easier selection in JS
    const selects = document.querySelectorAll('select');
    if (selects.length > 0) selects[0].setAttribute('aria-label', 'Department filter');
    if (selects.length > 1) selects[1].setAttribute('aria-label', 'Job Title filter');

    const paginationDiv = document.querySelector('.sm\\:flex-1.sm\\:flex.sm\\:items-center.sm\\:justify-between');
    if (paginationDiv) {
        paginationDiv.id = 'paginationContainer';
    }
    const tableBody = document.querySelector('table tbody');
    if(tableBody) tableBody.id = 'employeeTableBody';

});

// Initial fetch
fetchEmployees();
</script>
