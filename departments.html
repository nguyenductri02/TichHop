        <a href="employees.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">

        </a>

        </a>
        <a href="notifications.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-bell mr-3"></i> Alerts
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">

      <div class="px-4 py-4 border-t border-blue-700">

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Top Header -->
      <header class="bg-white shadow-sm">

            <div class="flex items-center">
                <h2 class="text-xl font-semibold text-gray-800">Department Management</h2>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative">
                    <i class="fas fa-bell text-gray-600 text-xl"></i>
                    <span class="absolute top-0 right-0 -mt-1 -mr-1 px-2 py-0.5 bg-red-500 text-white text-xs rounded-full">3</span>
                </button>
                <div class="flex items-center">
                    <img class="h-8 w-8 rounded-full" src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Profile">

                </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
        <!-- Department Stats -->

                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">

                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Total Departments</p>
                        <h3 class="text-xl font-semibold text-gray-700">12</h3>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-users text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">Total Employees</p>
                        <h3 class="text-xl font-semibold text-gray-700">1,254</h3>
                    </div>

            </div>
            <div class="bg-white rounded-lg shadow-sm p-6">
                <div class="flex items-center">

        <!-- Department List -->

            <div class="p-6">

<!-- Add Department Modal -->
<div id="addDepartmentModal" class="hidden fixed z-10 inset-0 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
<div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
        <form id="addDepartmentForm">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Add New Department</h3>
                <div class="space-y-4">
                    <div>
                        <label for="departmentNameModal" class="block text-sm font-medium text-gray-700 mb-2">Department Name</label>
                        <input type="text" name="departmentName" id="departmentNameModal" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="departmentManagerModal" class="block text-sm font-medium text-gray-700 mb-2">Department Manager</label>
                        <input type="text" name="departmentManager" id="departmentManagerModal" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="descriptionModal" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea name="description" id="descriptionModal" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                    Add Department
                </button>
                <button type="button" onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
</div>

<script>
const API_BASE_URL = 'http://localhost:5115/api'; // Adjust if your backend runs elsewhere

function getAuthToken() {
    return localStorage.getItem('authToken');
}

async function fetchDepartments() {
    const token = getAuthToken();
    if (!token) { window.location.href = 'login.html'; return; }

    try {
        console.log("Fetching departments from:", `${API_BASE_URL}/Integration/departments`);
        console.log("Auth token:", token.substring(0, 10) + "..." + token.substring(token.length - 10));
        
        const response = await fetch(`${API_BASE_URL}/Integration/departments`, {
            headers: { 
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/json'
            }
        });
        
        console.log("Response status:", response.status);
        
        if (response.status === 401) { 
            console.error("Unauthorized access - redirecting to login");
            window.location.href = 'login.html'; 
            return; 
        }
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error("Error response body:", errorText);
            throw new Error(`Failed to fetch departments: ${response.status} ${response.statusText}`);
        }
        
        const departments = await response.json();
        console.log("Departments fetched successfully:", departments);
        
        const departmentsWithPlaceholders = departments.map(dept => ({
            id: dept.departmentId,
            name: dept.name,
            manager: dept.managerName || 'N/A',
            employeeCount: 'N/A',
            projects: 'N/A',
            icon: "fa-building",
            color: "gray"
        }));

        renderDepartments(departmentsWithPlaceholders);
        updateDepartmentStats(departments.length, 'N/A', 'N/A');
    } catch (error) {
        console.error("Error fetching departments:", error);
        if (error.message.includes("Failed to fetch")) {
            console.error("This might be due to the backend server not running or being inaccessible. Please check if your server is running on " + API_BASE_URL);
        }
        const container = document.getElementById('departmentsContainer');
        if(container) container.innerHTML = `<p class="text-center col-span-full text-red-500">Failed to load departments: ${error.message}. Check console for details.</p>`;
        updateDepartmentStats(0,0,0);
    }
}

function renderDepartments(departments) {
    const container = document.getElementById('departmentsContainer'); 
    container.innerHTML = '';

    if (!departments || departments.length === 0) {
        container.innerHTML = '<p class="text-center col-span-full">No departments found.</p>';
        return;
    }

    departments.forEach(dept => {
        const card = `
            <div class="bg-white border rounded-lg overflow-hidden hover:shadow-lg transition-shadow">
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                                <i class="fas fa-building text-xl"></i>
                            </div>
                            <h4 class="text-lg font-semibold text-gray-800 ml-3">${dept.name}</h4>
                        </div>
                        <div class="flex space-x-2">
                            <button class="text-blue-600 hover:text-blue-800" onclick="editDepartment(${dept.id}, '${dept.name}')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-red-600 hover:text-red-800" onclick="deleteDepartment(${dept.id}, '${dept.name}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Employees:</span>
                            <span class="font-medium">${dept.employeeCount || 'N/A'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Manager:</span>
                            <span class="font-medium">${dept.manager || 'N/A'}</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Projects:</span>
                            <span class="font-medium">${dept.projects || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', card);
    });
}

function updateDepartmentStats(totalDepts, totalEmps, activeProjs) {
    const deptStatBoxes = document.querySelectorAll('.grid.grid-cols-1.md\\:grid-cols-3.gap-6.mb-6 > div');
    if (deptStatBoxes.length === 3) {
        deptStatBoxes[0].querySelector('h3').textContent = totalDepts;
        deptStatBoxes[1].querySelector('h3').textContent = totalEmps;
        deptStatBoxes[2].querySelector('h3').textContent = activeProjs;
    }
}

function openAddDepartmentModal() {
    document.getElementById('addDepartmentModal').classList.remove('hidden');
}

function closeModal() {
    const modal = document.getElementById('addDepartmentModal');
    if (modal) {
        modal.classList.add('hidden');
        const form = modal.querySelector('form');
        if (form) form.reset();
    }
}

async function handleAddDepartment(event) {
    event.preventDefault();
    const token = getAuthToken(); 
    if (!token) { window.location.href = 'login.html'; return; }

    const form = event.target;
    const deptName = form.elements['departmentName'].value;
    const managerName = form.elements['departmentManager'].value;

    if (!deptName) {
        alert("Department Name and Manager Name are required.");
        return;
    }
    
    const payload = { 
        name: deptName,
        managerName: managerName,
        departmentId: 0
    };

    console.log("Sending department payload:", payload);
    
    try {
        const response = await fetch(`${API_BASE_URL}/Integration/departments`, { 
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });
        
        console.log("Add department response status:", response.status);
        
        if (!response.ok) {
            let errorMessage = `Failed to add department. Status: ${response.status}`;
            try {
                const errorData = await response.json();
                console.error("Error response:", errorData);
                
                if (errorData && errorData.errors) {
                    const validationErrors = Object.values(errorData.errors).flat().join(', ');
                    errorMessage += ` Details: ${validationErrors}`;
                } else if (errorData && errorData.message) {
                    errorMessage = errorData.message;
                } else if (errorData) {
                    errorMessage = JSON.stringify(errorData);
                }
            } catch (jsonError) {
                const errorText = await response.text();
                console.error("Error text:", errorText);
                errorMessage += ` Details: ${errorText.substring(0, 100)}...`;
            }
            throw new Error(errorMessage);
        }
        
        alert('Department added successfully!');
        closeModal();
        fetchDepartments();
    } catch (error) {
        console.error("Error adding department:", error);
        alert(`Failed to add department: ${error.message}`);
    }
}

function editDepartment(id, name) { 
    const newName = prompt(`Enter new name for department "${name}" (ID: ${id}):`, name);
    if (newName && newName !== name) {
        const token = getAuthToken();
        if (!token) { window.location.href = 'login.html'; return; }

        const newManagerName = prompt(`Enter new manager name for department "${newName}" (ID: ${id}):`);

        fetch(`${API_BASE_URL}/Integration/departments/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ departmentId: id, name: newName, managerName: newManagerName || '' })
        })
        .then(response => {
            if (!response.ok) throw new Error('Failed to update department.');
            alert(`Department ${id} updated successfully.`);
            fetchDepartments();
        })
        .catch(error => {
            console.error("Error updating department:", error);
            alert(`Failed to update department: ${error.message}`);
        });
    }
}

async function deleteDepartment(id, name) { 
    if (!confirm(`Are you sure you want to delete department "${name}" (ID: ${id})?`)) return;
    
    const token = getAuthToken();
    if (!token) { window.location.href = 'login.html'; return; }

    try {
        const response = await fetch(`${API_BASE_URL}/Integration/departments/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.message || `Failed to delete department. Status: ${response.status}`);
        }
        alert(`Department "${name}" (ID: ${id}) deleted successfully.`);
        fetchDepartments();
    } catch (error) {
        console.error("Error deleting department:", error);
        alert(`Failed to delete department: ${error.message}`);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    console.log("Page loaded, initializing department page...");
    
    const token = getAuthToken();
    console.log("Auth token exists:", !!token);
    
    const addDepartmentButton = document.querySelector('button .fa-plus');
    if (addDepartmentButton) {
        console.log("Add department button found, attaching click event");
        addDepartmentButton.parentElement.addEventListener('click', openAddDepartmentModal);
    } else {
        console.error("Add department button not found");
    }
    
    const addDepartmentForm = document.getElementById('addDepartmentForm');
    if (addDepartmentForm) {
        console.log("Add department form found, attaching submit event");
        addDepartmentForm.addEventListener('submit', handleAddDepartment);
    } else {
        console.error("Add department form not found");
    }

    fetchDepartments();
});
</script>
</body>
</html>
