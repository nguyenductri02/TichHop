<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 font-[Poppins,sans-serif]">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="bg-blue-800 text-white w-64 py-4 flex flex-col">
      <div class="px-4 py-4 border-b border-blue-700">
        <h1 class="text-2xl font-bold">Admin</h1>
      </div>
      <nav class="flex-1 px-2 py-4 space-y-2">
        <a href="index.html" class="flex items-center px-4 py-3 hover:bg-blue-700 rounded-lg">
          <i class="fas fa-tachometer-alt mr-3"></i> Dashboard
        </a>
        <a href="users.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-user-shield mr-3"></i> Accounts & Roles
        </a>
        <a href="employees.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-users mr-3"></i> Employees
        </a>
        <a href="payroll.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-money-bill-wave mr-3"></i> Payroll
        </a>
        <a href="departments.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-building mr-3"></i> Departments
        </a>
        <a href="job_titles.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-briefcase mr-3"></i> Job Titles
        </a>
        <a href="reports.html" class="flex items-center px-4 py-3 bg-blue-700 rounded-lg">
          <i class="fas fa-chart-bar mr-3"></i> Reports
        </a>
        <a href="notifications.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-bell mr-3"></i> Alerts
        </a>
        <a href="settings.html" class="flex items-center px-4 py-3 hover:bg-blue-700 text-gray-300 rounded-lg">
          <i class="fas fa-cogs mr-3"></i> System Settings
        </a>
      </nav>
      <div class="px-4 py-4 border-t border-blue-700">
        <a href="login.html" class="flex items-center text-gray-300 hover:text-white">
          <i class="fas fa-sign-out-alt mr-3"></i> Logout
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center">
                <h2 class="text-xl font-semibold text-gray-800">Reports & Analytics</h2>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative">
                    <i class="fas fa-bell text-gray-600 text-xl"></i>
                    <span class="absolute top-0 right-0 -mt-1 -mr-1 px-2 py-0.5 bg-red-500 text-white text-xs rounded-full">3</span>
                </button>
                <div class="flex items-center">
                    <img class="h-8 w-8 rounded-full" src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Profile">
                    <span class="ml-2 text-gray-700">HR Manager</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
        <!-- Report Filters -->
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Report Type</label>
                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="employee">Employee Summary</option>
                        <option value="payroll">Payroll Report</option>
                        <option value="attendance">Attendance Report</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Department</label>
                    <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="">All Departments</option>
                        <option value="it">IT</option>
                        <option value="hr">HR</option>
                        <option value="marketing">Marketing</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date Range</label>
                    <input type="month" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div class="flex items-end">
                    <button class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Generate Report
                    </button>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <!-- Employee Distribution Chart -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Employee Distribution by Department</h3>
                <canvas id="departmentChart" height="300"></canvas>
            </div>

            <!-- Salary Distribution Chart -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Salary Distribution</h3>
                <canvas id="salaryChart" height="300"></canvas>
            </div>
        </div>

        <!-- Report Tables -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800">Employee Summary Report</h3>
            </div>
            <div class="p-6">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Employees</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Average Salary</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Turnover Rate</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script>
let reportData = null;
let departmentChart = null;
let salaryChart = null;

async function loadReportData() {
    try {
        const response = await IntegrationService.getReports();
        
        if (response.error) {
            alert('Error loading reports: ' + response.error);
            return;
        }
        
        reportData = response;
        processReportData();
        renderReportTable();
    } catch (error) {
        console.error('Error loading reports:', error);
        alert('Failed to load report data');
    }
}

function processReportData() {
    if (!reportData) return;
    
    // Group employees by department
    const departmentCounts = {};
    reportData.forEach(employee => {
        const dept = `Department ${employee.departmentId}`;
        departmentCounts[dept] = (departmentCounts[dept] || 0) + 1;
    });
    
    // Group employees by salary range
    const salaryRanges = {
        '<$50k': 0,
        '$50k-$70k': 0,
        '$70k-$90k': 0,
        '$90k-$110k': 0,
        '>$110k': 0
    };
    
    reportData.forEach(employee => {
        const salary = employee.netSalary;
        if (salary < 50000) salaryRanges['<$50k']++;
        else if (salary < 70000) salaryRanges['$50k-$70k']++;
        else if (salary < 90000) salaryRanges['$70k-$90k']++;
        else if (salary < 110000) salaryRanges['$90k-$110k']++;
        else salaryRanges['>$110k']++;
    });
    
    // Update charts with actual data
    updateDepartmentChart(departmentCounts);
    updateSalaryChart(salaryRanges);
}

function updateDepartmentChart(departmentCounts) {
    const ctx = document.getElementById('departmentChart').getContext('2d');
    
    // Destroy existing chart if it exists
    if (departmentChart) {
        departmentChart.destroy();
    }
    
    // Create new chart
    departmentChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: Object.keys(departmentCounts),
            datasets: [{
                data: Object.values(departmentCounts),
                backgroundColor: [
                    '#3B82F6',
                    '#10B981',
                    '#8B5CF6',
                    '#F59E0B',
                    '#EF4444'
                ]
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
}

function updateSalaryChart(salaryRanges) {
    const ctx = document.getElementById('salaryChart').getContext('2d');
    
    // Destroy existing chart if it exists
    if (salaryChart) {
        salaryChart.destroy();
    }
    
    // Create new chart
    salaryChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(salaryRanges),
            datasets: [{
                label: 'Number of Employees',
                data: Object.values(salaryRanges),
                backgroundColor: '#3B82F6'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
}

function renderReportTable() {
    if (!reportData) return;
    
    // Group by department
    const departmentSummary = {};
    reportData.forEach(employee => {
        const deptId = employee.departmentId;
        if (!departmentSummary[deptId]) {
            departmentSummary[deptId] = {
                count: 0,
                totalSalary: 0,
                turnover: Math.random() * 10 // Placeholder - would come from real data
            };
        }
        
        departmentSummary[deptId].count++;
        departmentSummary[deptId].totalSalary += employee.netSalary;
    });
    
    // Render table rows
    const tbody = document.querySelector('table.min-w-full tbody');
    tbody.innerHTML = '';
    
    Object.entries(departmentSummary).forEach(([deptId, data]) => {
        const avgSalary = data.count > 0 ? data.totalSalary / data.count : 0;
        
        tbody.innerHTML += `
            <tr>
                <td class="px-6 py-4 whitespace-nowrap">Department ${deptId}</td>
                <td class="px-6 py-4 whitespace-nowrap">${data.count}</td>
                <td class="px-6 py-4 whitespace-nowrap">$${avgSalary.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                <td class="px-6 py-4 whitespace-nowrap">${data.turnover.toFixed(1)}%</td>
            </tr>
        `;
    });
}

// Generate report on button click
document.querySelector('button.bg-blue-600').addEventListener('click', function() {
    loadReportData();
});

// Initialize charts with placeholder data on page load
document.addEventListener('DOMContentLoaded', function() {
    // Initial empty charts
    const departmentCtx = document.getElementById('departmentChart').getContext('2d');
    departmentChart = new Chart(departmentCtx, {
        type: 'pie',
        data: {
            labels: ['No Data Available'],
            datasets: [{
                data: [1],
                backgroundColor: ['#d1d5db']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });

    const salaryCtx = document.getElementById('salaryChart').getContext('2d');
    salaryChart = new Chart(salaryCtx, {
        type: 'bar',
        data: {
            labels: ['No Data Available'],
            datasets: [{
                label: 'No Data',
                data: [0],
                backgroundColor: '#d1d5db'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
});
</script>
</body>
</html>
