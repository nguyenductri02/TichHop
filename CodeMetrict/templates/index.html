<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ đánh giá chất lượng mã nguồn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-analyze {
            margin-top: 20px;
        }
        #results {
            margin-top: 20px;
        }
        .chart-container {
            margin-top: 20px;
            text-align: center;
        }
        .chart-container img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Công cụ đánh giá chất lượng mã nguồn</h1>
        
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Phân tích dự án</h5>
                
                <div class="mb-3">
                    <label class="form-label">Chọn loại phân tích:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="analysisType" id="fileAnalysis" value="file" checked>
                        <label class="form-check-label" for="fileAnalysis">
                            File đơn lẻ
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="analysisType" id="projectAnalysis" value="project">
                        <label class="form-check-label" for="projectAnalysis">
                            Thư mục dự án
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <input type="file" id="fileInput" class="form-control" />
                </div>

                <button id="analyzeButton" class="btn btn-success btn-analyze" disabled>Phân tích</button>
            </div>
        </div>

        <div id="results"></div>
        
        <div id="charts" class="chart-container">
            <div id="complexityChart"></div>
            <div id="cohesionCouplingChart"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script> <!-- Liên kết tệp main.js -->
</body>
</html>
